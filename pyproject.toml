[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulax-acv"
version = "0.1.0"
description = "Case-grouped ACV refrigerant fault ranking"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyarrow", "openpyxl", "streamlit", "plotly", "PyYAML", "joblib"]

[project.optional-dependencies]
dev = ["pytest", "playwright", "imageio-ffmpeg", "ruff"]
neural = ["torch"]
boosting = ["catboost>=1.2.8,<2"]

[tool.setuptools.packages.find]
include = ["acv*", "door*", "shm*"]

[tool.setuptools.package-data]
door = ["*.csv", "*.joblib"]
shm = ["*.csv", "*.json", "*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: supplied workbook and end-to-end tests"]

[tool.ruff]
target-version = "py311"
line-length = 160
exclude = ["delivery", "outputs", "artifacts", "PS3", ".venv", "*.ipynb"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["E701", "E702"]
